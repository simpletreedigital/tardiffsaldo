<title>Share Your Feedback | Tardiff &amp; Saldo Law Offices</title>
<meta name="description" content="Tell us how we did. Share your experience with Tardiff &amp; Saldo Law Offices in about 60 seconds. Your feedback helps us serve San Luis Obispo families better.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://tardiffsaldo.com/feedback/">

<style>
:root{--navy:#0F1F3D;--navy-mid:#162848;--navy-light:#1E3460;--gold:#C9A84C;--gold-light:#E2C97A;--gold-pale:#F5EDD4;--white:#FFFFFF;--off-white:#F7F5F0;--text-dark:#1A1A2E;--text-mid:#4A4A5A;--text-light:#8A8A9A;--font-serif:'Playfair Display',Georgia,serif;--font-sans:'Lato',Arial,sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
body{font-family:var(--font-sans);color:var(--text-dark);font-size:16px;line-height:1.6;background:var(--white);}
img{max-width:100%;height:auto;display:block;}.wrap{max-width:1200px;margin:0 auto;padding:0 1.5rem;}section{padding:72px 1.5rem;}
.section-label{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
.section-label::before{content:'';width:20px;height:2px;background:var(--gold);display:inline-block;}
h2.section-title{font-family:var(--font-serif);font-size:clamp(26px,3vw,40px);font-weight:700;color:var(--navy);line-height:1.2;margin-bottom:16px;}
.page-hero{background:var(--navy);background-size:cover;background-position:center;padding:40px 1.5rem 32px;text-align:center;}
.btn-gold{background:var(--gold);color:var(--navy);font-weight:700;font-family:var(--font-sans);font-size:14px;letter-spacing:0.05em;padding:13px 24px;border-radius:4px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:background 0.2s;text-transform:uppercase;}
.btn-gold:hover{background:var(--gold-light);}
.btn-outline{background:transparent;color:var(--white);font-weight:700;font-family:var(--font-sans);font-size:14px;padding:12px 24px;border-radius:4px;border:2px solid rgba(255,255,255,0.4);text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:all 0.2s;text-transform:uppercase;}
.btn-outline:hover{background:rgba(255,255,255,0.1);}
.hero-btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:8px;}
.checkmark-badge{width:64px;height:64px;border-radius:50%;background:rgba(201,168,76,0.15);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
.checkmark-badge svg{width:30px;height:30px;color:var(--gold);}
.next-steps-section{background:var(--off-white);}
.next-steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:48px;}
.next-step-card{background:var(--white);border:1px solid #E8E2D0;border-radius:8px;padding:28px;text-align:center;}
.next-step-num{width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--gold);font-family:var(--font-serif);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.next-step-title{font-family:var(--font-serif);font-size:17px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.next-step-text{font-size:14px;color:var(--text-mid);line-height:1.65;}
.booking-section{background:var(--white);padding:32px 1.5rem 56px;}
.booking-inner{max-width:1140px;margin:0 auto;}
.booking-header{text-align:center;max-width:640px;margin:0 auto 20px;}
.booking-header h2{font-size:clamp(22px,2.6vw,32px);margin-bottom:8px;}
.booking-header p{font-size:14px;}
.booking-card{background:var(--off-white);border:1px solid #E8E2D0;border-radius:10px;padding:8px;overflow:hidden;}
.booking-card iframe{border-radius:6px;min-height:680px;}
.call-strip{background:var(--navy);padding:56px 1.5rem;}
.call-strip-inner{max-width:860px;margin:0 auto;text-align:center;}
.call-strip h2{font-family:var(--font-serif);font-size:clamp(24px,3vw,34px);color:var(--white);margin-bottom:12px;line-height:1.25;}
.call-strip p{font-size:16px;color:rgba(255,255,255,0.7);max-width:520px;margin:0 auto 28px;line-height:1.7;}
.call-strip-phone{display:inline-flex;align-items:center;gap:12px;font-family:var(--font-serif);font-size:32px;font-weight:700;color:var(--gold-light);text-decoration:none;}
.call-strip-phone svg{width:26px;height:26px;flex-shrink:0;}
.call-strip-hours{font-size:13px;color:rgba(255,255,255,0.45);margin-top:12px;}
.office-section{background:var(--off-white);}
.office-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start;margin-top:8px;}
.office-details{padding-top:8px;}
.office-details h3{font-family:var(--font-serif);font-size:24px;color:var(--navy);margin-bottom:16px;}
.office-detail-row{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px;}
.office-detail-icon{width:38px;height:38px;border-radius:50%;background:rgba(201,168,76,0.15);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.office-detail-icon svg{width:18px;height:18px;color:var(--gold);}
.office-detail-label{font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-mid);margin-bottom:3px;}
.office-detail-value{font-size:15px;color:var(--navy);font-weight:600;line-height:1.5;}
.office-detail-value a{color:var(--navy);text-decoration:none;}
.office-detail-value a:hover{color:var(--gold);}
.map-embed{border-radius:8px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.1);}
.map-embed iframe{width:100%;height:100%;min-height:340px;display:block;border:0;}
@media(max-width:960px){.next-steps-grid{grid-template-columns:1fr;}.office-grid{grid-template-columns:1fr;}}
@media(max-width:600px){section{padding:52px 1.5rem;}.page-hero{padding:64px 1.5rem;}.call-strip-phone{font-size:26px;}}

.fb-section{background:var(--off-white);padding:40px 1.5rem 64px;}
.fb-card{max-width:760px;margin:0 auto;background:var(--white);border:1px solid #E8E2D0;border-radius:10px;padding:12px;overflow:hidden;}
.fb-card iframe{min-height:600px;border-radius:6px;}
.fb-note{text-align:center;font-size:13px;color:var(--text-light);margin-top:16px;}
</style>
</head>
<body>

<section class="page-hero" style="background-image:linear-gradient(to bottom,rgba(15,31,61,0.95),rgba(15,31,61,0.95)),url('/images/Lawyer-Team-working-together.jpg');">
  <div style="max-width:640px;margin:0 auto;">
    <h1 style="font-family:var(--font-serif);font-size:clamp(26px,3.4vw,40px);font-weight:700;color:var(--white);line-height:1.2;margin-bottom:12px;">How Did We Do? <em style="font-style:italic;color:var(--gold-light);">Tell Us in 60 Seconds.</em></h1>
    <p style="font-size:16px;color:rgba(255,255,255,0.78);line-height:1.65;">You trusted us with something important. Now we'd like to hear how it went. Your honest feedback helps us serve you, and the next family, even better.</p>
  </div>
</section>

<section class="fb-section">
  <div class="fb-card">
    <iframe src="https://book.tardiffsaldo.com/widget/survey/5WQgXBX2RDVBwqt7mg8F" style="border:none;width:100%;" scrolling="no" id="5WQgXBX2RDVBwqt7mg8F" title="survey" data-cookie-consent="true" data-cookie-consent-provider="auto"></iframe>
  </div>
  <p class="fb-note">It takes about a minute. Thank you for helping us improve.</p>
</section>

</main>
<script src="https://book.tardiffsaldo.com/js/form_embed.js"></script>
</body>
</html>
